# Supabase free projects pause after about a week without activity, which takes the
# database and product images offline. A daily API call that reads the database keeps
# the project active.
# Optional repository variable KEEPALIVE_URL overrides the default backend URL
# (set it to https://<api-domain>/api after moving the backend to EC2).
# Note: GitHub disables scheduled workflows in repositories with no activity for 60 days.
name: Keep Supabase active

on:
  schedule:
    - cron: '17 1 * * *' # daily, 08:17 Vietnam time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.KEEPALIVE_URL || 'https://web-base-backend.vercel.app/api' }}
    steps:
      - name: Query an endpoint that hits the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "$API_URL/products?limit=1")
          echo "GET $API_URL/products?limit=1 -> $code"
          test "$code" = "200"
