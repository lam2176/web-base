app = "prod-base-sale-shop-backend"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]

[deploy]

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 250
    hard_limit = 300

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "get"
    path = "/api/check-health"
    protocol = "http"
    timeout = "10s"
    tls_skip_verify = false

# VM config
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9091
  path = "/metrics"
